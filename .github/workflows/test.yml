name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # 20 is the floor in package.json "engines"; 22 is the current LTS.
        # A pass on a newer Node proves nothing about the floor.
        node: [20, 22]
    steps:
      # Actions pinned to commit SHAs (D5 L4), the pins the suite uses.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
      # Exactly the install INSTALL.md tells members to run (npm ci, both lockfiles).
      - run: npm run install:all
      # Build before testing: the launcher smoke test skips without web/dist.
      - run: npm run build
      - run: npm test
